# =============================================================================
#  Local development stack: MySQL + the Go API, on Debian images.
#
#    cp .env.example .env      # fill in the passwords first
#    docker compose up -d
#    docker compose run --rm pipeline        # load the data
#
#  The ingestion is a one-shot job, not a service -- it runs for a couple of
#  minutes once a day. In GCP that is Cloud Scheduler hitting a Cloud Run job;
#  here it is `docker compose run`.
# =============================================================================

name: projet-paris

services:
  # ---------------------------------------------------------------- MySQL ---
  mysql:
    image: mysql:8.0-debian
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Files here run in name order, once, on an empty data volume.
      - ../pipeline/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  # ------------------------------------------------------------- Go API ----
  api:
    build:
      context: ../services/api-go
    environment:
      PORT: "8080"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      # No load balancer in front of compose, so X-Forwarded-For is untrusted
      # here and the rate limiter keys on the real peer address.
      TRUST_PROXY: "false"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    # No healthcheck: the runtime image ships no curl or wget to probe /healthz
    # with. /readyz is there for the platform probe in GCP.
    restart: unless-stopped

  # ----------------------------------------------------- ingestion (job) ---
  pipeline:
    build:
      context: ../pipeline
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    depends_on:
      mysql:
        condition: service_healthy
    # Only runs when asked: `docker compose run --rm pipeline`.
    profiles: ["jobs"]
    restart: "no"

volumes:
  mysql-data:
