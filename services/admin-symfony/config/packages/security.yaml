security:
  password_hashers:
    Symfony\Component\Security\Core\User\InMemoryUser: 'auto'

  providers:
    # Back-office staff only. There is no public sign-up: reporting a broken
    # fountain must not require an account, so the write endpoint is anonymous
    # and everything under /api/admin is not.
    admins:
      memory:
        users:
          '%env(ADMIN_USERNAME)%':
            password: '%env(ADMIN_PASSWORD_HASH)%'
            roles: ['ROLE_ADMIN']

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    api:
      pattern: ^/api
      stateless: true
      provider: admins
      http_basic: true

  access_control:
    - { path: ^/api/admin, roles: ROLE_ADMIN }
    - { path: ^/api/reports, methods: [POST], roles: PUBLIC_ACCESS }
    - { path: ^/api, methods: [GET], roles: PUBLIC_ACCESS }
    - { path: ^/api, roles: ROLE_ADMIN }
